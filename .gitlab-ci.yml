mirror:
  image: alpine:latest
  rules:
  - if: $CI_PIPELINE_SOURCE == "schedule"
  - if: $CI_PIPELINE_SOURCE == "web"
  variables:
    GIT_STRATEGY: none
  script:
  - apk add --no-cache git git-lfs
  - git clone --mirror https://github.com/bittner/bittner.git repo
  - cd repo
  - git remote add gitlab https://oauth2:${GITLAB_TOKEN}@gitlab.com/bittner/bittner.git
  - git lfs fetch --all origin
  - git lfs push --all gitlab
  - git push --force --prune gitlab 'refs/heads/*:refs/heads/*' 'refs/tags/*:refs/tags/*'
