name: Star History Chart

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-star-history:
    runs-on: ubuntu-latest
    env:
      REPO_LIST: bittner/pyclean,painless-software/python-cli-test-helpers,painless-software/django-probes,behave/behave-django,jazzband/django-analytical,behave/behave,ctsdownloads/easyspeak
    steps:
    - uses: actions/checkout@v6
      with:
        lfs: true
    - uses: astral-sh/setup-uv@v6
    - name: Diagnose token
      env:
        TOK: ${{ secrets.STAR_HISTORY_TOKEN }}
      run: |
        for ep in repos/behave/behave repos/behave/behave/stargazers repos/bittner/pyclean/stargazers; do
          plain=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOK" "https://api.github.com/$ep")
          star=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOK" -H "Accept: application/vnd.github.star+json" "https://api.github.com/$ep")
          echo "$ep  ->  plain=$plain  star+json=$star"
        done
        echo -n "unauth stargazers baseline: "
        curl -s -o /dev/null -w '%{http_code}\n' "https://api.github.com/repos/behave/behave/stargazers"
    - name: Generate Star History Chart
      env:
        GITHUB_TOKEN: ${{ secrets.STAR_HISTORY_TOKEN }}
      run: uv run star-history/generate_chart.py
    - name: Commit & Push
      run: |
        git config user.name github-actions
        git config user.email github-actions@github.com
        git add star-history/
        if git commit -m "Update star history chart"; then
          git push
        fi
