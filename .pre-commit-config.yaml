repos:
- repo: local
  hooks:
  - id: ruff-check
    name: ruff check
    entry: uvx ruff check --fix
    language: system
    types_or: [python, pyi]
    require_serial: true
  - id: ruff-format
    name: ruff format
    entry: uvx ruff format
    language: system
    types_or: [python, pyi]
    require_serial: true
  - id: mypy
    name: mypy
    entry: uvx mypy
    language: system
    types_or: [python, pyi]
    require_serial: true
  - id: pytest-doctests
    name: pytest (doctests)
    entry: uv run pytest
    language: system
    pass_filenames: false
    always_run: true
  - id: pyclean
    name: pyclean
    entry: uvx pyclean .
    language: system
    pass_filenames: false
    always_run: true
