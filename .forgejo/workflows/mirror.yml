on:
  schedule:
  - cron: '0 2 * * *'
  workflow_dispatch:
jobs:
  mirror:
    runs-on: codeberg-small
    steps:
    - name: Sync repository from GitHub
      env:
        CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
        SOURCE: github.com/bittner/bittner.git
        TARGET: codeberg.org/bittner/bittner.git
        USER: bittner
      run: |
        git clone https://${SOURCE} clone
        cd clone
        git remote add codeberg https://${USER}:${CODEBERG_TOKEN}@${TARGET}
        git push --force codeberg main
